<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>رسائل أستاذة منى</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Layout: one centered column on a flat blush ground: flower, title, subtitle, then a white form card; the letter opens in a second card below. */
  :root {
    --bg: #fdeef5;
    --surface: #ffffff;
    --fg: #3a2433;
    --title: #a53a6e;
    --muted: #8a7783;
    --accent: #c8497f;
    --accent-2: #ee86b4;
    --line: #f4cfe0;
    --gold: #d98a1c;
    --font-display: "Cairo", "Tajawal", system-ui, sans-serif;
    --font-body: "Cairo", "Tajawal", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.8;
    padding-block: 36px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 100vh;
  }
  main {
    max-width: 480px;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }
  header { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .flower { font-size: 64px; line-height: 1.2; }
  h1 {
    font-size: clamp(30px, 8vw, 38px);
    line-height: 1.5;
    margin: 0;
    font-weight: 800;
    color: var(--title);
    text-wrap: balance;
  }
  .lead { color: var(--muted); margin: 0; font-size: 17px; text-wrap: balance; }

  .card {
    background: var(--surface);
    border-radius: 26px;
    padding: 24px 20px;
    box-shadow: 0 8px 28px rgba(200, 73, 127, 0.14);
  }
  form { display: flex; flex-direction: column; gap: 14px; }
  label { font-weight: 700; font-size: 17px; text-align: center; }
  input[type="text"] {
    width: 100%;
    min-width: 0;
    font: inherit;
    text-align: center;
    padding: 15px 16px;
    border-radius: 20px;
    border: 2px solid var(--line);
    background: #fff8fb;
    color: var(--fg);
  }
  input[type="text"]::placeholder { color: #b7a5b0; }
  input[type="text"]:focus-visible,
  button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  button {
    font: inherit;
    font-weight: 500;
    font-size: 18px;
    width: 100%;
    padding: 15px 20px;
    border-radius: 20px;
    border: 0;
    color: #ffffff;
    cursor: pointer;
    background: linear-gradient(110deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 16px rgba(200, 73, 127, 0.28);
  }
  button:hover { filter: brightness(1.06); }
  .hint { min-height: 1.6em; margin: 0; font-size: 15px; color: var(--accent); text-align: center; }

  .letter { display: flex; flex-direction: column; gap: 12px; position: relative; padding: 30px 24px 24px; }
  .letter[hidden] { display: none; }
  .letter.show { animation: rise 0.7s ease both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .letter.show { animation: none; }
  }
  .from { margin: 0; font-size: 15px; color: var(--muted); text-align: center; }
  .from b { color: var(--title); }
  .to {
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 800;
    line-height: 1.6;
    margin: 0;
    color: var(--accent);
    text-align: center;
    overflow-wrap: anywhere;
  }
  .msg { margin: 0; font-size: 18px; font-weight: 500; line-height: 2.1; text-align: center; text-wrap: pretty; }
  .sign {
    margin: 6px 0 0;
    padding-top: 14px;
    border-top: 1.5px dashed var(--line);
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 700;
    text-align: center;
    color: var(--title);
  }
  .copy {
    background: #fff8fb;
    color: var(--accent);
    border: 2px solid var(--line);
    box-shadow: none;
    font-size: 16px;
    font-weight: 700;
    padding: 10px 18px;
  }
  footer { text-align: center; color: var(--muted); font-size: 14px; }
</style>

<main dir="rtl" lang="ar">
  <header>
    <div class="flower" aria-hidden="true">🌸</div>
    <h1>رسالة خاصة لكِ</h1>
    <p class="lead">اكتبي اسمكِ لتري رسالة التفوق والتميّز من أستاذة منى بازرعه</p>
  </header>

  <div class="card">
    <form id="nameForm" autocomplete="off" novalidate>
      <label for="nameInput">اسم الطالبة</label>
      <input type="text" id="nameInput" placeholder="اكتبي اسمكِ هنا" maxlength="40" enterkeyhint="go">
      <button type="submit" id="showBtn">اظهري رسالتي ✨</button>
      <p class="hint" id="hint" role="status" aria-live="polite"></p>
    </form>
  </div>

  <section class="card letter" id="letter" hidden aria-live="polite">
    <p class="from">رسالتكِ من <b>أستاذة منى بازرعه</b> تقول:</p>
    <h2 class="to" id="toName"></h2>
    <p class="msg" id="msgText"></p>
    <p class="sign">بكل الحب والفخر، أستاذتكِ منى بازرعه</p>
    <button type="button" class="copy" id="copyBtn">نسخ الرسالة</button>
  </section>

  <footer>لكل طالبة رسالة مختلفة، فاحتفظي برسالتكِ.</footer>
</main>

<script>
  var MESSAGES = [
    "{name}، أنتِ من الطالبات اللواتي يجعلن الفصل أجمل بحضورهن. اجتهادكِ واضح، وتفوقكِ ليس صدفة بل ثمرة تعبكِ. استمري، فالقادم أجمل بإذن الله.",
    "{name} الغالية، كل خطوة تخطينها اليوم تبني امرأة عظيمة غدًا. أنا فخورة بكِ، وأثق أن اسمكِ سيلمع في كل مكان تذهبين إليه.",
    "يا {name}، أخلاقكِ قبل علمكِ تاجٌ تلبسينه. اجمعي بينهما كما تفعلين الآن، وستكونين قدوة لكل من حولكِ.",
    "{name} المبدعة، لديكِ لمسة خاصة في كل ما تقدمينه. لا تخفي موهبتكِ، فالعالم يحتاج إلى أفكاركِ.",
    "غاليتي {name}، تذكري أن النجاح رحلة، وأنكِ قطعتِ منها شوطًا جميلًا. ارفعي رأسكِ، فقد أحسنتِ.",
    "{name}، صبركِ واجتهادكِ في الأيام الصعبة هو ما يصنع الفرق. سيأتي يوم تنظرين فيه إلى الوراء وتبتسمين لأنكِ لم تستسلمي.",
    "يا {name}، ابتسامتكِ في الصف تمنح الطاقة لكل من حولكِ. احتفظي بهذه الروح، فهي سرّ من أسرار تميزكِ.",
    "{name} النجيبة، أرى فيكِ قائدة المستقبل. ثقتكِ بنفسكِ وحسن تعاملكِ صفتان لا يملكهما الجميع.",
    "عزيزتي {name}، لا تقارني نفسكِ بأحد، بل قارنيها بنفسكِ بالأمس. وأنتِ اليوم أفضل بكثير، وهذا يكفيني فخرًا.",
    "{name}، دفتركِ المرتب وعملكِ المتقن يقولان الكثير عنكِ. الإتقان عبادة، وأنتِ تؤدينها بحب.",
    "{name}، كل درجة حصلتِ عليها شهادة على ليالٍ من الجد. أنتِ تستحقين كل نجاح، وأكثر.",
    "يا {name}، أنتِ مثال للطالبة التي تساعد زميلاتها دون أن يُطلب منها. هذا الكرم سيعود إليكِ أضعافًا.",
    "{name} المتألقة، لا تخافي من الخطأ، فهو أول درجات التعلّم. وأنتِ تتعلمين بسرعة تدهشني.",
    "يا {name}، تقدّمكِ هذا العام كان ملحوظًا، وأنا أراه وأقدّره. استمري بهذه الهمّة العالية.",
    "{name} الذكية، لديكِ قدرة رائعة على الربط والفهم. هذه موهبة، فاستثمريها في كل ما تقرئين.",
    "غاليتي {name}، الالتزام والانضباط صفتان تزيّنانكِ، ومن تملك الالتزام تملك النجاح.",
    "{name}، أنتِ نجمة في سماء هذا الفصل، وكل نجمة تضيء بطريقتها. فضيئي دائمًا.",
    "يا {name}، لا تنسي أن تكافئي نفسكِ على تعبكِ. فرحتكِ بإنجازكِ هي وقودكِ للإنجاز القادم.",
    "{name} الرائعة، أحب حماسكِ مع كل نشاط جديد. هذا الحماس سيأخذكِ إلى أماكن بعيدة.",
    "{name}، والداكِ محظوظان بكِ، وأنا محظوظة لأنكِ من طالباتي. شكرًا لأنكِ أنتِ.",
    "{name} المجتهدة، تعبكِ اليوم راحة الغد. وثقي أن الله لا يضيع أجر من أحسن عملًا.",
    "غاليتي {name}، روحكِ المتعاونة تجعل العمل الجماعي متعة. ستنجحين في كل فريق تكونين فيه.",
    "يا {name}، أنتِ قصة نجاح تُكتب الآن، وأنا سعيدة لأن لي سطرًا فيها. أكملي الحكاية بالجمال نفسه.",
    "{name} المتميزة، تفوقكِ يُلهم زميلاتكِ قبل أن يُسعدني. كوني دائمًا هذا الإلهام.",
    "عزيزتي {name}، العلم نور، وقد رأيته يكبر فيكِ يومًا بعد يوم. بارك الله فيكِ وزادكِ علمًا وتوفيقًا.",
    "{name}، أنتِ لا تكتفين بالإجابة الصحيحة، بل تبحثين عن الأجمل. وهذا هو الفرق بين الجيدة والمتميزة.",
    "غاليتي {name}، المستقبل ينتظر أمثالكِ ليصنعن الفرق. استعدّي له بالعلم، وأنا واثقة أنكِ ستبهرينه."
  ];

  function normalize(s) {
    return s
      .replace(/[ً-ٰٟـ]/g, "")
      .replace(/[أإآ]/g, "ا")
      .replace(/ة/g, "ه")
      .replace(/ى/g, "ي")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();
  }

  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function pickMessage(name) {
    return MESSAGES[hash(normalize(name)) % MESSAGES.length];
  }

  var form = document.getElementById("nameForm");
  var input = document.getElementById("nameInput");
  var hint = document.getElementById("hint");
  var letter = document.getElementById("letter");
  var toName = document.getElementById("toName");
  var msgText = document.getElementById("msgText");
  var copyBtn = document.getElementById("copyBtn");
  var currentText = "";

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var raw = input.value.replace(/\s+/g, " ").trim();
    if (!raw) {
      hint.textContent = "اكتبي اسمك أولًا لتظهر رسالتك.";
      letter.hidden = true;
      input.focus();
      return;
    }
    hint.textContent = "";
    var first = raw.split(" ")[0];
    var msg = pickMessage(raw).split("{name}").join(first);
    toName.textContent = "إلى الغالية " + raw;
    msgText.textContent = msg;
    currentText = "رسالتكِ من أستاذة منى بازرعه تقول:\n" + msg + "\nبكل الحب والفخر، أستاذتكِ منى بازرعه";
    copyBtn.textContent = "نسخ الرسالة";
    letter.hidden = false;
    letter.classList.remove("show");
    void letter.offsetWidth;
    letter.classList.add("show");
    letter.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });

  copyBtn.addEventListener("click", function () {
    function done() { copyBtn.textContent = "تم النسخ"; }
    function fallback() {
      var range = document.createRange();
      range.selectNodeContents(msgText);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      copyBtn.textContent = "تم تحديد النص، انسخيه";
    }
    try {
      navigator.clipboard.writeText(currentText).then(done, fallback);
    } catch (err) {
      fallback();
    }
  });
</script>

</body></html>
